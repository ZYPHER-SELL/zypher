<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Cancelled - Zypher</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .cancel-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .cancel-box {
            background: var(--bg-card);
            padding: 60px;
            border-radius: 16px;
            border: 1px solid var(--border);
            text-align: center;
            max-width: 600px;
            width: 100%;
            animation: fadeInUp 0.6s ease-out;
        }

        .cancel-icon {
            font-size: 80px;
            color: #ef4444;
            margin-bottom: 20px;
        }

        .cancel-box h1 {
            color: var(--primary);
            margin-bottom: 20px;
            font-size: 36px;
        }

        .cancel-box p {
            color: var(--text-dim);
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <div class="bg-animation"></div>

    <div class="cancel-container">
        <div class="cancel-box">
            <div class="cancel-icon">✗</div>
            <h1>Payment Cancelled</h1>
            <p>Your payment was cancelled. No charges have been made to your account.</p>
            <a href="/" class="btn btn-primary">Return to Home</a>
        </div>
    </div>
</body>
</html>
