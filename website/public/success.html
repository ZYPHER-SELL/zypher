<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Success - Zypher</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .success-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .success-box {
            background: var(--bg-card);
            padding: 60px;
            border-radius: 16px;
            border: 1px solid var(--border);
            text-align: center;
            max-width: 600px;
            width: 100%;
            animation: fadeInUp 0.6s ease-out;
        }

        .success-icon {
            font-size: 80px;
            color: #22c55e;
            margin-bottom: 20px;
        }

        .success-box h1 {
            color: var(--primary);
            margin-bottom: 20px;
            font-size: 36px;
        }

        .success-box p {
            color: var(--text-dim);
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .check-email {
            background: rgba(167, 139, 250, 0.1);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--primary);
            margin-bottom: 30px;
        }

        .check-email strong {
            color: var(--primary);
        }
    </style>
</head>
<body>
    <div class="bg-animation"></div>

    <div class="success-container">
        <div class="success-box">
            <div class="success-icon">✓</div>
            <h1>Payment Successful!</h1>
            <p>Thank you for your purchase. Your license key has been sent to your email address.</p>

            <div class="check-email">
                <strong>Check your email now!</strong><br>
                You should receive your license key and receipt within a few minutes.
            </div>

            <a href="/" class="btn btn-primary">Return to Home</a>
        </div>
    </div>
</body>
</html>
